<div class="page" [class.intro]="intro.playing()">
  <header class="top">
    <a class="name" routerLink="/" #name>Sávio Issa</a>
    <app-lang-select class="corner" />
  </header>

  <router-outlet />

  @if (showFooter()) {
    <footer class="bottom corner">
      <app-theme-switch />
      <nav class="socials" aria-label="Links">
        <a [href]="links.cv" target="_blank" rel="noopener noreferrer">CV</a>
        <a [href]="links.linkedin" target="_blank" rel="noopener noreferrer">LI</a>
        <a [href]="links.mail">MAIL</a>
      </nav>
    </footer>
  }
</div>

@if (intro.playing()) {
  <!-- Intro: só o nome no centro; um clique ou uma tecla adiantam a ida dele para o canto -->
  <div class="splash" aria-hidden="true" (click)="skipIntro()">
    <span class="splash-name" #splash>Sávio Issa</span>
  </div>
}

<app-cursor-dot />
