<div class="page">
  <header class="header">
    @if (isHome()) {
      <nav class="socials" aria-label="Links">
        <app-glass-button [href]="links.cv" [external]="true">CV</app-glass-button>
        <app-glass-button [href]="links.linkedin" [external]="true">LI</app-glass-button>
        <app-glass-button [href]="links.mail">MAIL</app-glass-button>
      </nav>
    } @else {
      <app-glass-button route="/">
        <app-icon name="arrow-left-md" />
        {{ i18n.t('back') }}
      </app-glass-button>
    }
    <div class="controls">
      <app-theme-switch />
      <app-lang-select />
    </div>
  </header>

  <router-outlet />
</div>
