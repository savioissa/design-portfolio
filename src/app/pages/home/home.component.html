<main class="hero">
  <section class="intro">
    <h1 class="title">
      @for (line of i18n.titleLines(); track $index) {
        <span class="line">{{ line }} </span>
      }
    </h1>
    <p class="subtitle">{{ i18n.t('subtitle') }}</p>
  </section>

  <nav class="menu" aria-label="Menu">
    @for (item of menu; track item.key) {
      @if (item.route) {
        <a class="item" [routerLink]="item.route">{{ i18n.t(item.key) }}</a>
      } @else {
        <button type="button" class="item" appSoon>{{ i18n.t(item.key) }}</button>
      }
    }
  </nav>
</main>
