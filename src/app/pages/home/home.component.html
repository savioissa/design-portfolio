<main class="hero">
  <section class="visually-hidden">
    <h1>
      @for (line of i18n.titleLines(); track $index) {
        <span>{{ line }} </span>
      }
    </h1>
    <p>{{ i18n.t('subtitle') }}</p>
  </section>

  <!-- Só depois da intro, para a entrada dos itens acontecer quando o nome chega ao canto -->
  @if (!intro.playing()) {
    <nav class="menu" aria-label="Menu">
      @for (item of menu; track item.key) {
        <a class="item" [routerLink]="item.route">{{ i18n.t(item.key) }}</a>
      }
    </nav>
  }
</main>
